name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: "!endsWith(github.actor, '[bot]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.CLOUD_SECRET }}
          claude_args: "--model claude-haiku-4-5-20251001"
          show_full_output: true
          use_sticky_comment: true
          prompt: |
            Review PR #$PR_NUMBER. The env vars $PR_NUMBER and $PR_AUTHOR are set. Do NOT ask questions. Execute immediately.

            CRITICAL RULES:
            - NEVER use the Read tool. NEVER use the Glob tool. NEVER use the Grep tool.
            - NEVER run `git diff` on individual files. Get the FULL diff ONCE.
            - Keep output short. No fluff, no praise, no "strengths" sections.
            - The diff only shows CHANGED lines. If new code references something not visible in the diff (a field, function, class, etc.), verify it exists on main before flagging: `git show origin/master:<file_path> | grep "<name>"`. Only flag as missing if it doesn't exist on main either.

            ## Step 0: Check if already reviewed

            Run these two commands:
            ```
            gh api repos/${{ github.repository }}/issues/$PR_NUMBER/comments --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "claude") | .body] | last' 2>/dev/null
            gh pr diff $PR_NUMBER | md5sum | cut -d' ' -f1
            ```

            Only check comments from the Claude bot (login "claude" or "claude[bot]"). Ignore other bots.

            The bot review comments include a hidden marker: `<!-- diff-hash:HASH -->`.
            Extract the hash from the last Claude bot comment and compare it to the current diff hash.
            This hash is based on the PR diff content — it stays the same on rebase if no code changed.

            If the last Claude bot comment contains ("Approved" or "LGTM") AND the diff hash matches:
            - STOP IMMEDIATELY. Do not run any more commands. Do not post anything. Just say "LGTM" and exit.
            - Do NOT proceed to Step 1, 2, or 3.

            If the hash doesn't match BUT the previous comment was Approved or LGTM:
            - The code changed but was previously approved. Only review the NEW commits, not the full PR.
            - Run: `git log <previous_reviewed_commit>..HEAD --oneline` to see what's new (the previous commit SHA is NOT available — instead just look at the last 1-3 commits via `git log origin/master..HEAD --oneline` and focus on the most recent ones).
            - If the new commits are minor (cleanup, formatting, typo fixes, import reordering) and introduce no issues, just post "✅ LGTM" with the updated diff-hash. Do NOT re-review all files.
            - Only do a full review if the new commits introduce significant new logic or you spot issues.

            If there is no Claude bot comment, or the last comment contains "Needs Minor Changes" or "Needs Major Changes", proceed to Step 1 (full review).

            ## Step 1: Gather all context (ONE batch)

            First, ensure origin/master is up to date, then get everything:
            ```
            git fetch origin main --quiet
            git log origin/master..HEAD --oneline
            gh pr diff $PR_NUMBER --patch | filterdiff -x '*/Pipfile.lock' -x '*/postman/*' -x '*.json'
            gh pr view $PR_NUMBER --json body -q .body
            gh pr view $PR_NUMBER --json labels --jq '.labels[].name'
            ```

            If `filterdiff` is not available, use this alternative for the diff:
            ```
            gh pr diff $PR_NUMBER --patch | grep -v -E '^(diff --git a/(Pipfile\.lock|postman/)|index |Binary files )' | awk '/^diff --git/{skip=0} /^diff --git a\/(Pipfile\.lock|postman\/|.*\.json)/{skip=1} !skip'
            ```

            The diff may be large. That's OK — review what you received. Do NOT run any more diff commands after this. Do NOT run git diff on individual files. Do NOT use Read/Glob/Grep tools. You have all the information you need.

            ## Step 2: Update PR Description

            The PR body may contain markers: `<!-- CLAUDE:START -->` ... `<!-- CLAUDE:END -->`

            Generate a concise description:
            ```
            ## Summary
            <2-3 sentence overview>

            ## Changes
            <bulleted list, grouped logically>

            ## Test Plan
            <how to verify>
            ```

            - If markers exist and content hasn't changed, skip the update
            - If markers exist, replace ONLY the content between them
            - If no markers, prepend `<!-- CLAUDE:START -->\n<description>\n<!-- CLAUDE:END -->\n\n` before existing body

            Update via: `gh pr edit $PR_NUMBER --body "<updated body>"`

            ## Step 3: Review Time Label

            Based on diff stat size and complexity:
            - "1 min review": typos, config, single-line fixes
            - "5 min review": few files, straightforward
            - "10 min review": multiple files, new functions
            - "20 min review": new features, significant refactors
            - "30 min review": architectural changes, new modules

            Check existing label from the labels you already fetched in Step 1.
            If existing label matches — do nothing. Otherwise:
            ```
            CHOSEN_LABEL="<chosen label>"
            EXISTING_LABEL="<existing label or empty>"
            if [ -n "$EXISTING_LABEL" ]; then
              gh pr edit $PR_NUMBER --remove-label "$EXISTING_LABEL"
            fi
            gh pr edit $PR_NUMBER --add-label "$CHOSEN_LABEL"
            ```

            ## Step 4: Code Review

            Review the diff you already fetched in Step 1. Do NOT fetch anything else.

            Build a review comment with these sections (skip any section if nothing to report):

            ### Issues Found
            File path, line number, severity (bug/perf/security/style), fix suggestion.

            ### Test Coverage
            Note untested new logic. Skip if tests are adequate.

            ### Suggested Reviewer
            1. Get collaborators: `gh api repos/${{ github.repository }}/collaborators --jq '.[].login'`
            2. Changed files are already in your diff stat from Step 1.
            3. For each changed file (excluding tests, migrations, lock files): `gh api "repos/${{ github.repository }}/commits?path=<file>&per_page=30" --jq '.[].author.login'`
            4. Count commits per author. IMPORTANT: You MUST exclude `$PR_AUTHOR` from the results — never suggest the PR author as a reviewer. Keep only collaborators from step 1.
            5. Suggest top 1-2 with reason. If no one remains after excluding `$PR_AUTHOR` — skip this section entirely.

            ### Verdict
            - ✅ **Approved** — No issues found
            - ⚠️ **Needs Minor Changes** — Small improvements suggested
            - ❌ **Needs Major Changes** — Significant issues must be addressed

            IMPORTANT: If your verdict is ✅ Approved AND the previous Claude bot comment was also Approved or LGTM, just post "✅ LGTM" with the diff-hash marker. Do NOT repeat the full review.

            Always append a hidden diff hash marker at the very end of your review comment:

            Post:
            ```
            DIFF_HASH=$(gh pr diff $PR_NUMBER | md5sum | cut -d' ' -f1)
            cat > /tmp/review.md << REVIEW_EOF
            <your review content>

            <!-- diff-hash:$DIFF_HASH -->
            REVIEW_EOF
            gh pr comment $PR_NUMBER --body "$(cat /tmp/review.md)"
            ```
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
